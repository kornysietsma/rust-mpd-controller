[package]
name = "rust-mpd-controller"
version = "0.1.0"
edition = "2024"
authors = ["Korny Sietsma <korny@sietsma.com>"]
readme = "README.md"
# license = "MIT"  # https://spdx.org/licenses/
# categories = [] # https://crates.io/category_slugs
# keywords = [] # free text


[dependencies]
anyhow = "1.0.104"
log = "0.4.33"
# `muda` is deliberately *not* a direct dependency: `tray_icon::menu` re-exports
# it wholesale. Declaring it here too would let Cargo resolve a second, separate
# muda version from tray-icon's, and muda's menu-event handling is process-global
# — two versions means clicks silently stop arriving.
tray-icon = "0.24.2"
tao = "0.35.3"
mpd_client = "1.4.1"
tokio = { version = "1.53.1", features = ["full"] }
shlex = "2.0.1"
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
simplelog = "0.12.2"
url = "2.5.8"
percent-encoding = "2.3.2"
[dev-dependencies]
pretty_assertions = "1.4.1"

[package.metadata.bundle]
name = "MpdController"
identifier = "com.sietsma.mpdcontroller"
icon = ["assets/icon.icns"]
copyright = "Copyright (c) 2026 Korny Sietsma"
category = "public.app-category.music"
short_description = "Menu-bar MPD controller"
osx_url_schemes = ["mpdcontrol"]
osx_info_plist_exts = ["assets/info-plist-ext.plist"]
