[package]
name = "album-tool"
version = "0.1.0"
edition = "2024"
authors = ["Korny Sietsma <korny@sietsma.com>"]
license = "MIT"

[dependencies]
albumdb = { path = "../albumdb" }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
mpd_client = "1.4.1"
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
