[package]
name = "controller"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"

[dependencies]
albumdb = { path = "../albumdb" }
anyhow.workspace = true
log = "0.4.33"
# `muda` is deliberately *not* a direct dependency: `tray_icon::menu` re-exports
# it wholesale. Declaring it here too would let Cargo resolve a second, separate
# muda version from tray-icon's, and muda's menu-event handling is process-global
# — two versions means clicks silently stop arriving.
tray-icon = "0.24.2"
tao = "0.35.3"
mpd-conf = { path = "../mpd-conf" }
mpd_client.workspace = true
tokio = { workspace = true, features = ["full"] }
shlex = "2.0.1"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
simplelog = "0.12.2"
url = "2.5.8"
percent-encoding = "2.3.2"
# Clipboard, for the menu's copy-URI rows. `default-features = false` drops the
# `image` feature (we only ever set text); what's left on macOS is the objc2
# stack, every crate of which `tao`/`tray-icon` already pull in at the same
# version — so this adds exactly one crate to the build.
arboard = { version = "3.6.1", default-features = false }

[dev-dependencies]
pretty_assertions.workspace = true
